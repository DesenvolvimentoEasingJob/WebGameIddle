services:
  db:
    image: postgres:16-alpine
    container_name: skyspire-db
    environment:
      POSTGRES_DB: skyspire
      POSTGRES_USER: skyspire
      POSTGRES_PASSWORD: skyspire
    ports:
      - "5432:5432"
    volumes:
      - skyspire_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyspire -d skyspire"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skyspire-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=db;Port=5432;Database=skyspire;Username=skyspire;Password=skyspire
      DB_CONNECTION: Host=db;Port=5432;Database=skyspire;Username=skyspire;Password=skyspire
      ContentPath: /app/content
      DataPath: /app/data
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./content:/app/content:ro
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  skyspire_pgdata:
